[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filesight"
version = "0.6.0"
description = "Local image analysis tool that suggests human-readable file names"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "pillow>=10.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# DirectML/ONNX acceleration (Windows). Installed separately for the
# bundled build; onnxruntime-directml also provides the CPU provider.
directml = ["onnxruntime-directml>=1.24"]
onnx = ["onnxruntime>=1.18"]

[project.scripts]
filesight = "filesight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
